# Configuracion de herramientas de calidad del backend de Dona.
#
# Ruff (lint) — adopcion por RATCHET: arrancamos con reglas de alta senal y bajo
# ruido para no ahogar al dev solo. Backlog a habilitar incrementalmente (cada
# uno en su PR):
#   - "E"    estilo pycodestyle
#   - "S"    flake8-bandit (SAST)      -> con per-file-ignores para FPs ya vistos
#            (google_calendar _FALLBACK_STATE_SECRET/_TOKEN_URL, welcome
#            _PASSWORD_PREFIX, real_world md5, storage sha1 — todos no-secreto)
#   - "B904" raise ... from ...        -> ~17 sitios
# E501 (linea larga) se ignora siempre: lo cubriria el formatter, no lo forzamos.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I", "UP", "B"]
# UP042 (str,Enum -> StrEnum) NO se aplica: cambia __str__ y NivelRiesgo es zona
# roja (clasificacion de riesgo). Revisar manualmente si se quiere migrar.
ignore = ["B904", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
