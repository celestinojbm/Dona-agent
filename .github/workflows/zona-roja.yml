name: Zona roja (human-reviewed)

# Gate de la zona ROJA (docs/ops/zonificacion-autonomia.md, secciones 3 y 5.1).
# Falla si la PR, sin una etiqueta 'human-reviewed' vigente:
#   1. modifica un archivo ROJO de la §3 (incluido el nombre anterior en un
#      renombre);
#   2. modifica un workflow de CI (§2 y §5.1: editar `.github/workflows/*`
#      debilita el propio gate). Excepción: agent-runs-validation.yml (verde);
#   3. borra, renombra o quita líneas con asserts en los tests protegidos de la
#      §5.1.
#
# Por qué pull_request_target y no pull_request: con pull_request corre la
# versión del workflow que trae la PR, así que una PR podía editar este archivo
# (quitar una ruta de la lista) y su propia ejecución pasaba. Con
# pull_request_target corre siempre la versión de la rama base. Es seguro
# porque el job NO hace checkout ni ejecuta código de la PR: solo lee
# metadatos por la API.
#
# La etiqueta caduca con cada push, sin depender del orden de los eventos. Al
# ponerla una persona (evento 'labeled', emisor de tipo User), el gate deja un
# SELLO: un commit status '$CONTEXTO' en success sobre el SHA de cabeza, creado
# por github-actions[bot] y con la base en la descripción. Después, cualquier
# ejecución (edited, labeled de otra etiqueta, reopened…) solo pasa si la
# etiqueta sigue puesta Y el SHA de cabeza actual tiene ese sello con la base
# actual. Un push cambia el SHA → no hay sello → falla y se retira la etiqueta.
# Antes la caducidad dependía de que corriera la ejecución de 'synchronize', y
# con cancel-in-progress cualquier evento posterior (p. ej. un agente que edita
# la descripción de la PR justo después de empujar) la cancelaba: la etiqueta
# vieja sobrevivía y el check pasaba sobre un diff que nadie revisó.
#
# Etiqueta puesta por un bot (claude[bot], github-actions…): no sella y se
# retira. Límite conocido: un token personal se ve como User; el gate no
# distingue a una persona de un agente que usa su token.
#
# Cambio de rama base ('edited' con changes.base): pull_request_target corre la
# versión del workflow de la rama BASE de la PR. Sin re-ejecutar aquí, bastaba
# con apuntar la PR a una rama propia con un gate aflojado, empujar (el check
# pasa en ese SHA) y volver a apuntarla a main. Por eso se re-ejecuta, la
# etiqueta caduca al cambiar la base y se publica un estado 'failure' en el
# contexto del sello (el último estado por contexto manda, así que anula
# cualquier sello anterior sobre ese SHA). Además el sello lleva la base y se
# compara con la base actual.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write  # solo para retirar la etiqueta caducada (push o cambio de base)
  statuses: write       # sello de la revisión humana ligado al SHA de cabeza

# Sin cancel-in-progress: una ejecución en curso (p. ej. la que sella tras
# 'labeled' o la que invalida tras un cambio de base) termina siempre. La
# corrección ya no depende de esto (el sello va ligado al SHA), pero evita que
# un evento cualquiera tire una ejecución a medias.
concurrency:
  group: zona-roja-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  zona-roja:
    name: Zona roja (human-reviewed)
    runs-on: ubuntu-latest
    steps:
      - name: Verificar archivos ROJOS contra la etiqueta human-reviewed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACCION: ${{ github.event.action }}
          # Rama base anterior; solo viene en 'edited' cuando cambió la base.
          BASE_ANTERIOR: ${{ github.event.changes.base.ref.from }}
          # SHA de cabeza en el momento del evento (lo que vio quien etiquetó).
          SHA_EVENTO: ${{ github.event.pull_request.head.sha }}
          # Solo en 'labeled'/'unlabeled': qué etiqueta y qué tipo de cuenta.
          ETIQUETA_EVENTO: ${{ github.event.label.name }}
          TIPO_EMISOR: ${{ github.event.sender.type }}
        run: |
          set -euo pipefail
          ETIQUETA="human-reviewed"
          CONTEXTO="zona-roja/revision-humana"
          SELLADOR="github-actions[bot]"

          # IMPORTANTE: esta lista debe mantenerse sincronizada con la lista ROJA
          # de la sección 3 de docs/ops/zonificacion-autonomia.md. Si cambias
          # una, cambia la otra en la misma PR.
          cat > rojos.txt <<'EOF'
          agent/billing.py
          agent/automation/credits.py
          agent/billing_commands.py
          landing/app/api/webhook/route.ts
          landing/app/api/checkout/route.ts
          landing/app/api/billing-portal/route.ts
          landing/app/api/cancel-subscription/route.ts
          landing/lib/internal-bridge.ts
          landing/lib/stripe.ts
          agent/envio_gate.py
          agent/automation/consent_terceros.py
          agent/automation/executors/send_message.py
          agent/automation/permissions.py
          landing/app/api/automation/acciones/[id]/high-confirmar/route.ts
          agent/brain.py
          config/prompts.yaml
          agent/main.py
          agent/entorno.py
          agent/rate_limiter.py
          agent/inbound_tokens.py
          agent/crypto.py
          agent/dashboard_lockout.py
          agent/readiness.py
          landing/auth.ts
          landing/lib/auth-lockout-bridge.ts
          landing/lib/dashboard-auth.ts
          landing/lib/auth-matcher.ts
          agent/providers/whapi.py
          agent/providers/meta.py
          agent/providers/base.py
          agent/legal_pages.py
          .github/workflows/zona-roja.yml
          docs/ops/zonificacion-autonomia.md
          pytest.ini
          EOF
          # El heredoc conserva la indentación del YAML: se recorta.
          sed -i 's/^[[:space:]]*//' rojos.txt

          # Tests protegidos de la §5.1 (borrarlos o quitarles asserts es ROJO;
          # añadir cobertura sigue siendo verde).
          RE_TESTS='^tests/test_(billing|tcpa|dedup|security_fixes|providers|fail_closed_entorno|readiness_secrets)[^/]*\.py$|^tests/test_automation_[^/]*(high|credits|execution)[^/]*\.py$'
          # Líneas AÑADIDAS que desactivan tests sin quitar ningún assert.
          RE_SALTO='pytest\.(skip|xfail|importorskip)|mark\.(skip|skipif|xfail)|pytestmark|collect_ignore'
          # conftest.py: cualquier línea (añadida o quitada) que toque la recolección.
          RE_CONFTEST_SALTO='skip|xfail|deselect|collect_ignore|ignore|modifyitems'

          # Estado actual de la PR (no el payload del evento, que se congela).
          gh api "repos/$REPO/pulls/$PR" > pr.json
          SHA_ACTUAL="$(jq -r '.head.sha' pr.json)"
          BASE_ACTUAL="$(jq -r '.base.ref' pr.json)"
          TOTAL_ARCHIVOS="$(jq -r '.changed_files // 0' pr.json)"
          DESCRIPCION_SELLO="Revisión humana · base=$BASE_ACTUAL"

          # Archivos de la PR (paginado): un objeto JSON por línea.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | tojson' > archivos.jsonl
          jq -r '.filename, (.previous_filename // empty)' archivos.jsonl | sort -u > cambiados.txt

          # 0. La API lista como máximo 3000 archivos: si la lista está
          #    incompleta no se puede afirmar que no toca zona roja (fail-closed).
          listados="$(wc -l < archivos.jsonl | tr -d ' ')"
          : > tocados.txt
          if [ "$listados" -lt "$TOTAL_ARCHIVOS" ]; then
            echo "(lista de archivos incompleta: $listados de $TOTAL_ARCHIVOS)" >> tocados.txt
          fi

          # 1. Comparación literal de rutas completas.
          grep -F -x -f rojos.txt cambiados.txt >> tocados.txt || true

          # 2. Workflows de CI (excepto el auxiliar verde de la §2).
          grep -E '^\.github/workflows/' cambiados.txt \
            | grep -v -F -x '.github/workflows/agent-runs-validation.yml' >> tocados.txt || true

          # 3. Tests de la §5.1: borrados, renombrados, sin parche visible (diff
          #    demasiado grande), con alguna línea quitada que contenga un assert
          #    o con alguna línea añadida que los salte (skip/xfail/pytestmark).
          jq -r --arg re "$RE_TESTS" --arg salto "$RE_SALTO" '
            select((.filename | test($re)) or ((.previous_filename // "") | test($re)))
            | select(
                .status == "removed" or .status == "renamed" or (.patch == null)
                or ([.patch | split("\n")[]
                     | select(
                         (startswith("-") and test("assert|pytest\\.(raises|fail)"))
                         or (startswith("+") and test($salto))
                       )]
                    | length > 0)
              )
            | .filename' archivos.jsonl >> tocados.txt

          # 4. conftest.py: puede saltar o deseleccionar tests protegidos sin
          #    tocarlos (collect_ignore, pytest_collection_modifyitems…).
          jq -r --arg salto "$RE_CONFTEST_SALTO" '
            select((.filename | test("(^|/)conftest\\.py$")) or ((.previous_filename // "") | test("(^|/)conftest\\.py$")))
            | select(
                .status == "removed" or .status == "renamed" or (.patch == null)
                or ([.patch | split("\n")[]
                     | select((startswith("+") or startswith("-")) and test($salto))]
                    | length > 0)
              )
            | .filename' archivos.jsonl >> tocados.txt

          tocados="$(sort -u tocados.txt)"
          if [ -z "$tocados" ]; then
            echo "La PR no modifica archivos de la zona ROJA."
            exit 0
          fi

          echo "Archivos de la zona ROJA modificados en esta PR:"
          echo "$tocados" | sed 's/^/  - /'

          # Etiquetas actuales leídas por la API (no del payload del evento, que
          # queda congelado si se relanza una ejecución vieja).
          tiene_etiqueta=false
          if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -F -x -q "$ETIQUETA"; then
            tiene_etiqueta=true
          fi

          retirar_etiqueta() {
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/$ETIQUETA" > /dev/null || true
          }

          publicar_sello() {  # $1 = success | failure
            gh api -X POST "repos/$REPO/statuses/$SHA_ACTUAL" \
              -f state="$1" -f context="$CONTEXTO" -f description="$DESCRIPCION_SELLO" > /dev/null
          }

          # El sello vale si el ÚLTIMO estado del contexto en el SHA actual es
          # success, lo creó este workflow y lleva la base actual.
          sello_valido() {
            gh api "repos/$REPO/commits/$SHA_ACTUAL/statuses?per_page=100" > estados.json
            jq -e --arg ctx "$CONTEXTO" --arg quien "$SELLADOR" --arg desc "$DESCRIPCION_SELLO" '
              [.[] | select(.context == $ctx)] | first
              | (. != null) and .state == "success" and .creator.login == $quien
                and .description == $desc' estados.json > /dev/null
          }

          # Cambio de rama base: la revisión cubría otra base. Se invalida el
          # sello (failure como último estado del contexto) y la etiqueta.
          if [ "$ACCION" = "edited" ] && [ -n "${BASE_ANTERIOR:-}" ]; then
            publicar_sello failure || true
            if [ "$tiene_etiqueta" = "true" ]; then
              retirar_etiqueta
            fi
            echo "::error::Cambio de rama base en una PR de zona ROJA: la revisión anterior ya no vale. Revisa el diff contra la base nueva y vuelve a poner '$ETIQUETA'."
            exit 1
          fi

          # Alguien acaba de poner la etiqueta: se sella el SHA que vio.
          if [ "$ACCION" = "labeled" ] && [ "${ETIQUETA_EVENTO:-}" = "$ETIQUETA" ] && [ "$tiene_etiqueta" = "true" ]; then
            if [ "${TIPO_EMISOR:-}" != "User" ]; then
              retirar_etiqueta
              echo "::error::La etiqueta '$ETIQUETA' la puso una cuenta de tipo '${TIPO_EMISOR:-desconocido}'. Solo cuenta si la pone una persona: se retiró."
              exit 1
            fi
            if [ "${SHA_EVENTO:-}" != "$SHA_ACTUAL" ]; then
              retirar_etiqueta
              echo "::error::Hubo un push entre la revisión y la ejecución del gate (etiquetado en ${SHA_EVENTO:-?}, cabeza actual $SHA_ACTUAL). Revisa el diff nuevo y vuelve a poner '$ETIQUETA'."
              exit 1
            fi
            publicar_sello success
            echo "Etiqueta '$ETIQUETA' puesta por una persona sobre $SHA_ACTUAL (base $BASE_ACTUAL). Sello publicado. Gate superado."
            exit 0
          fi

          if [ "$tiene_etiqueta" = "true" ]; then
            if sello_valido; then
              echo "La PR tiene la etiqueta '$ETIQUETA' y el sello sobre $SHA_ACTUAL (base $BASE_ACTUAL). Gate superado."
              exit 0
            fi
            # Sin sello para este SHA: hubo push o cambio de base después de la
            # revisión, o la ejecución que sellaba no llegó a correr. Se retira
            # para que volver a ponerla dispare 'labeled' y selle el SHA actual.
            retirar_etiqueta
            echo "::error::La etiqueta '$ETIQUETA' no tiene sello para el commit actual $SHA_ACTUAL (push o cambio de base posterior a la revisión, o la ejecución que sellaba no corrió). Se retiró: revisa el diff y vuelve a ponerla."
            exit 1
          fi

          while IFS= read -r f; do
            echo "::error file=$f::Archivo de la zona ROJA modificado sin la etiqueta '$ETIQUETA'."
          done <<< "$tocados"
          echo "::error::Esta PR modifica archivos de la zona ROJA (docs/ops/zonificacion-autonomia.md, secciones 3 y 5.1). Requiere revisión humana: un humano debe revisarla y añadir la etiqueta '$ETIQUETA'."
          exit 1
