name: Claude Review

# Capa 3 del stack: 2º revisor IA en cada PR (patrón "un agente propone, otro
# verifica"). Es ASESOR — comenta, NO bloquea el merge (el gate duro es pytest).
#
# Auth: secret ANTHROPIC_API_KEY (LLM) + el GITHUB_TOKEN del CI para postear
# comentarios — NO requiere instalar la GitHub App de Claude. Sin el secret el
# paso se salta (check verde). continue-on-error → aunque el review falle, nunca
# bloquea el PR. Costo aprox: ~$0.05/PR en Sonnet (<$5/mes a ~50 PRs).

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review (asesor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Se salta si el secret no está configurado: el workflow queda "listo"
      # sin romper PRs hasta que actives ANTHROPIC_API_KEY.
      - name: Claude Code Review
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true  # asesor: aunque el review falle, NUNCA bloquea el PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          # GITHUB_TOKEN del CI para postear (sin GitHub App). Por eso no se usa
          # track_progress: su flujo de inline-comments depende de la App.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--max-turns 40 --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
          prompt: |
            Revisa este PR de Dona (asistente de IA por WhatsApp, EN PRODUCCIÓN, marco TCPA/CCPA).
            Enfócate en CORRECCIÓN y en las invariantes críticas del proyecto (ver CLAUDE.md):
            - Patrón preparar_X/confirmar_X intacto en tools pagadas/irreversibles (verbos literales).
            - Comandos deterministas (saldo, recargar, imagen, STOP/START, privacidad) NO delegados al LLM.
            - Billing en créditos enteros, idempotente por stripe_session_id, con audit trail.
            - Invariantes con `raise` explícito, NUNCA `assert` (producción corre con -O → fail-open silencioso).
            - Datos externos (Gmail/Drive/web) sanitizados por _PATRONES_INYECCION antes de inyectar al prompt.
            - Identificadores (subscription_id, customerId) SOLO desde la sesión server-side, nunca del cliente.
            - Tokens admin/HMAC comparados con hmac.compare_digest; comportamiento fail-closed por defecto.
            - Respeta la zonificación de docs/ops/zonificacion-autonomia.md (señala si un cambio toca zona roja).
            Da severidad explícita (CRITICAL/HIGH/MEDIUM/LOW). Usa `gh pr comment` para el resumen
            top-level y comentarios inline para hallazgos puntuales. Sé conciso: reporta solo lo accionable
            (prioriza CRITICAL/HIGH). NO apruebes ni bloquees el merge — eres asesor, la decisión es humana.
