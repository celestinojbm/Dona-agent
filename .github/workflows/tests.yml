name: Tests

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancela corridas anteriores de la misma rama/PR para no malgastar runners.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Suite completa (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover necesita historia para comparar con origin/main

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (incluye pytest-cov + diff-cover)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # conftest.py fija ENVIRONMENT=test, DATABASE_URL sqlite y claves fake:
      # la suite es autocontenida (SQLite en archivo temporal, sin secretos reales).
      # Umbral global ANTI-REGRESION: baseline medido = 48%; piso en 46% (margen
      # 2pt para fluctuacion). No deja que la cobertura del repo baje; subirlo a
      # medida que se agrega cobertura.
      - name: Correr pytest con cobertura
        run: python -m pytest -q --cov=agent --cov-report=xml --cov-report=term-missing --cov-fail-under=46

      # En PRs: el codigo NUEVO/MODIFICADO debe estar bien cubierto (no fuerza
      # subir la cobertura del legacy de golpe).
      - name: Cobertura del diff (solo PRs)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --quiet
          diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
